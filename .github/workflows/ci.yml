name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Check generated harness integrations
        run: uv run python tools/generate_harness_integrations.py --check

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Run Node checks
        run: npm run check:node

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run Ruff lint
        run: uv run ruff check tests/ tools/

      - name: Check Ruff formatting
        run: uv run ruff format --check tests/ tools/

      - name: Check Markdown links
        run: uv run python tools/check_markdown_links.py
