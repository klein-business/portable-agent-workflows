[project]
name = "portable-agent-work-model"
version = "0.1.0"
description = "Harness-agnostic agent work domain model, portable skills, adapters, and artifact lifecycle examples."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
